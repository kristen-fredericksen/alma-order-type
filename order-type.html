document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-display: swap;\n  src: url(\"7889b130-a41f-4df3-8e31-ffc3fce13511\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Libre Franklin';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f579e9ce-7537-4524-aa1b-8fe40fbcafb2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Libre Franklin';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"77eba6e7-812c-4534-9b34-4fa283e67c15\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n:root{\n  --font-sans:\"Libre Franklin\",Arial,Helvetica,sans-serif;\n  --font-display:var(--font-sans);\n  /* Retained alias: CUNY specifies no condensed web face. Resolves to the sans. */\n  --font-condensed:var(--font-sans);\n  /* Addition, not CUNY-specified — see readme.md > Intentional additions. */\n  --font-mono:\"IBM Plex Mono\",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n   Colours — sourced verbatim from CUNY Office of Communications & Marketing,\n   University Identity > Colors (cuny.edu). Hex values are the published ones.\n   Do not eyeball or derive brand colours; if a value is not below, it is not\n   a CUNY colour. The supplied OLS logo files were built to an older CUNY Blue\n   (#1D3A83) and are NOT the colour source — see readme.md.\n   ========================================================================= */\n:root{\n  /* ---------- PRIMARY. ~50% of any design. Never omit CUNY Blue. ---------- */\n  --cuny-blue:#0033A1;   /* PMS 286 C   · CMYK 100/75/0/4 · RGB 0/51/161 */\n  --taxi:#FFB71B;        /* PMS 1235 C  · CMYK 0/31/98/0  · RGB 255/183/27 */\n\n  /* ---------- SECONDARY. Support and visual interest, in moderation. ---------- */\n  --indigo:#011D49;      /* PMS 2768 C */\n  --azure:#1F5CFF;       /* PMS 285 C  */\n  --deep-cyan:#00AFEF;   /* PMS 305 C  */\n  --sky:#A3C9FF;         /* PMS 7451 C */\n  --lemonade:#FFEE1D;    /* PMS 803 C  */\n  --cream:#FFFCD5;       /* PMS 9141 C */\n\n  /* ---------- NEUTRAL. Support, in moderation. Warm, not blue-grey. ---------- */\n  --pearl:#F7F4EB;       /* PMS 9060 C */\n  --dove:#D8D7D6;        /* PMS Cool Gray 1 C */\n  --slate:#688197;       /* PMS 2165 C */\n  --charcoal:#383838;    /* PMS Black 7 C */\n  --pewter:#76777A;      /* PMS Cool Gray 9 C */\n  --ochre:#C89210;       /* PMS 1245 C */\n  --umber:#896B25;       /* PMS 1265 C */\n\n  /* ---------- ACCENT. Highlights only. Never a primary colour. ---------- */\n  --strawberry:#EA0045;  /* PMS 192 C  */\n  --hot-pink:#E81F75;    /* PMS 213 C  */\n  --bubble-gum:#FF9CCD;  /* PMS 210 C  */\n  --blush:#FFDCEE;       /* PMS 705 C  */\n  --cranberry:#BF0D3E;   /* PMS 193 C  */\n  --coral:#FF7370;       /* PMS 805 C  */\n  --salmon:#FFCBCA;      /* PMS 7415 C */\n  --grape:#510C76;       /* PMS 2607 C */\n  --lilac:#9A3CB0;       /* PMS 7442 C */\n  --thistle:#DEC2EB;     /* PMS 263 C  */\n  --sea-green:#005C5A;   /* PMS 561 C  */\n  --chartreuse:#C2D500;  /* PMS 382 C  */\n  --liberty:#45C2B1;     /* PMS 3258 C */\n  --mint:#B5EBD8;        /* PMS 331 C  */\n\n  --white:#FFFFFF;\n  --black:#000000;\n\n  /* ============ Working scales ============\n     Steps that are NOT published CUNY colours exist only to make UI states\n     possible (hover, disabled, hairlines). Every published colour is marked. */\n  --blue-950:#01122E;\n  --blue-900:#011D49;   /* = Indigo */\n  --blue-800:#002679;\n  --blue-700:#0033A1;   /* = CUNY Blue */\n  --blue-600:#0F45BE;\n  --blue-500:#1F5CFF;   /* = Azure */\n  --blue-400:#5C87FF;\n  --blue-300:#A3C9FF;   /* = Sky */\n  --blue-200:#C6DBFF;\n  --blue-100:#E4EEFF;\n  --blue-50:#F2F7FF;\n\n  --gray-950:#1A1A1A;\n  --gray-900:#383838;   /* = Charcoal */\n  --gray-800:#4D4D4D;\n  --gray-700:#5F6062;\n  --gray-600:#76777A;   /* = Pewter */\n  --gray-500:#949599;\n  --gray-450:#8A8B8F;   /* not a CUNY colour — lowest step reaching 3:1 on white,\n                           so interactive control boundaries meet WCAG 1.4.11 */\n  --gray-400:#B4B4B3;\n  --gray-300:#D8D7D6;   /* = Dove */\n  --gray-200:#E6E5E2;\n  --gray-150:#EEEDE8;\n  --gray-100:#F2F1EC;\n  --gray-50:#F7F4EB;    /* = Pearl */\n\n  /* Status ramps, built only from published CUNY colours */\n  --green-700:#004745;\n  --green-600:#005C5A;  /* = Sea Green */\n  --green-100:#B5EBD8;  /* = Mint */\n  --amber-700:#896B25;  /* = Umber, for warning TEXT (AA on white) */\n  --amber-600:#C89210;  /* = Ochre, for warning MARKS */\n  --amber-100:#FFFCD5;  /* = Cream */\n  --red-700:#8E0A2E;\n  --red-600:#BF0D3E;    /* = Cranberry */\n  --red-100:#FFCBCA;    /* = Salmon */\n\n  /* ================= Semantic aliases ================= */\n  /* Text */\n  --text-body:var(--charcoal);\n  --text-heading:var(--indigo);\n  /* Pewter (4.48:1) and Slate (4.06:1) are published CUNY colours but fall short\n     of WCAG AA for body-size text, so the muted/subtle TEXT aliases point at\n     darker working steps. Use Pewter and Slate directly for rules, marks, and\n     display-size type only — never for 13–16px copy. */\n  --text-muted:var(--gray-800);    /* #4D4D4D · 8.45:1 on white */\n  --text-subtle:var(--gray-700);   /* #5F6062 · 6.29:1 on white */\n  --text-inverse:var(--white);\n  --text-link:var(--cuny-blue);\n  --text-link-hover:var(--indigo);\n  --text-accent:var(--cuny-blue);\n  --text-danger:var(--cranberry);\n  --text-success:var(--sea-green);\n  --text-warning:var(--umber);\n\n  /* Surfaces */\n  --surface-page:var(--white);\n  --surface-sunken:var(--pearl);\n  --surface-card:var(--white);\n  --surface-raised:var(--white);\n  --surface-brand:var(--cuny-blue);\n  --surface-brand-deep:var(--indigo);\n  --surface-brand-subtle:var(--blue-50);\n  --surface-neutral-subtle:var(--gray-100);\n  --surface-hover:var(--gray-100);\n  --surface-active:var(--gray-200);\n  --surface-overlay:rgba(1,29,73,.6);\n\n  /* Borders */\n  --border-subtle:var(--gray-200);\n  --border-default:var(--dove);        /* decorative hairlines only — 1.44:1 */\n  --border-strong:var(--gray-450);     /* 3.40:1 — meets WCAG 1.4.11 */\n  --border-control:var(--gray-450);    /* boundary of any focusable control */\n  --border-brand:var(--cuny-blue);\n  --border-focus:var(--azure);\n\n  /* Controls */\n  --control-primary-bg:var(--cuny-blue);\n  --control-primary-bg-hover:var(--blue-800);\n  --control-primary-bg-active:var(--indigo);\n  --control-primary-fg:var(--white);\n  --control-secondary-bg:var(--white);\n  --control-secondary-fg:var(--cuny-blue);\n  --control-secondary-border:var(--cuny-blue);\n  --control-ghost-fg:var(--gray-700);\n  --control-disabled-bg:var(--gray-150);\n  --control-disabled-fg:var(--gray-700);  /* exempt from 1.4.3, but kept legible */\n\n  /* Rules */\n  --rule-brand:var(--cuny-blue);\n  --rule-accent:var(--taxi);\n  --rule-hairline:var(--gray-200);\n\n  /* Non-text contrast reference (WCAG 1.4.11, needs 3:1 against its neighbour):\n       --border-control  3.40  PASS   control boundaries\n       --border-strong   3.40  PASS   checkbox and radio outlines\n       --border-focus    5.21  PASS   Azure focus ring on white\n       --border-default  1.44  n/a    decorative hairline, never a control edge\n       --rule-hairline   1.26  n/a    decorative\n       --rule-accent     1.74  n/a    decorative Taxi rule; never carries meaning alone */\n\n  /* Status tint borders, so components stop carrying literal hexes */\n  --border-success:#8FD9BE;\n  --border-warning:#EDDF9E;\n  --border-danger:#F5A9A7;\n  --border-info:var(--blue-200);\n}\n<\u002Fstyle>\n  <style>:root{\n  /* Sizes — 16px body base. Institutional, high-legibility, no sub-14px body copy. */\n  --text-2xs:11px;\n  --text-xs:12px;\n  --text-sm:14px;\n  --text-base:16px;\n  --text-md:18px;\n  --text-lg:20px;\n  --text-xl:24px;\n  --text-2xl:30px;\n  --text-3xl:38px;\n  --text-4xl:48px;\n  --text-5xl:60px;\n  --text-6xl:76px;\n\n  --weight-light:300;\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n  --weight-bold:700;\n  --weight-extrabold:800;\n\n  --leading-tight:1.08;\n  --leading-snug:1.2;\n  --leading-heading:1.25;\n  --leading-normal:1.5;\n  --leading-relaxed:1.65;\n\n  --tracking-tightest:-.02em;\n  --tracking-tight:-.01em;\n  --tracking-normal:0;\n  --tracking-wide:.02em;\n  --tracking-caps:.08em;\n\n  /* Composed roles */\n  --type-display:var(--weight-extrabold) var(--text-5xl)/var(--leading-tight) var(--font-display);\n  --type-h1:var(--weight-bold) var(--text-3xl)/var(--leading-snug) var(--font-sans);\n  --type-h2:var(--weight-bold) var(--text-2xl)/var(--leading-heading) var(--font-sans);\n  --type-h3:var(--weight-semibold) var(--text-xl)/var(--leading-heading) var(--font-sans);\n  --type-h4:var(--weight-semibold) var(--text-md)/var(--leading-heading) var(--font-sans);\n  --type-body:var(--weight-regular) var(--text-base)/var(--leading-relaxed) var(--font-sans);\n  --type-body-sm:var(--weight-regular) var(--text-sm)/var(--leading-normal) var(--font-sans);\n  --type-lead:var(--weight-regular) var(--text-md)/var(--leading-relaxed) var(--font-sans);\n  --type-label:var(--weight-semibold) var(--text-sm)/var(--leading-normal) var(--font-sans);\n  --type-eyebrow:var(--weight-bold) var(--text-xs)/var(--leading-normal) var(--font-sans);\n  --type-mono:var(--weight-regular) var(--text-sm)/var(--leading-normal) var(--font-mono);\n\n  --measure-prose:68ch;\n  --measure-narrow:52ch;\n}\n<\u002Fstyle>\n  <style>:root{\n  /* 4px base grid */\n  --space-0:0px;\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:24px;\n  --space-8:32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-16:64px;\n  --space-20:80px;\n  --space-24:96px;\n  --space-32:128px;\n\n  /* Radii — deliberately tight. The logo is hard-edged and the brand reads\n     institutional, not consumer-soft. Nothing above 8px except pills. */\n  --radius-none:0px;\n  --radius-xs:2px;\n  --radius-sm:3px;\n  --radius-md:4px;\n  --radius-lg:6px;\n  --radius-xl:8px;\n  --radius-pill:999px;\n\n  --border-width-hairline:1px;\n  --border-width-thick:2px;\n  --border-width-rule:4px;\n\n  --container-prose:760px;\n  --container-content:1080px;\n  --container-wide:1280px;\n  --gutter-page:24px;\n  --gutter-page-lg:40px;\n}\n<\u002Fstyle>\n  <style>:root{\n  /* Cool-gray shadows, low spread. Elevation is used sparingly: cards are\n     usually a 1px border on white, not a floating shadow. */\n  --shadow-none:none;\n  --shadow-xs:0 1px 1px rgba(26,26,27,.05);\n  --shadow-sm:0 1px 2px rgba(26,26,27,.07),0 1px 1px rgba(26,26,27,.04);\n  --shadow-md:0 2px 4px rgba(26,26,27,.08),0 4px 12px rgba(26,26,27,.06);\n  --shadow-lg:0 8px 24px rgba(26,26,27,.10),0 2px 6px rgba(26,26,27,.06);\n  --shadow-inset-top:inset 0 1px 0 rgba(255,255,255,.6);\n  --focus-ring:0 0 0 3px rgba(49,89,180,.35);\n  --focus-ring-inverse:0 0 0 3px rgba(255,255,255,.6);\n}\n<\u002Fstyle>\n  <style>:root{\n  /* Short, flat, functional. No bounce, no spring, no decorative motion. */\n  --duration-instant:80ms; /* @kind other */\n  --duration-fast:120ms; /* @kind other */\n  --duration-normal:180ms; /* @kind other */\n  --duration-slow:260ms; /* @kind other */\n  --ease-standard:cubic-bezier(.2,0,.2,1); /* @kind other */\n  --ease-out:cubic-bezier(0,0,.2,1); /* @kind other */\n  --ease-in-out:cubic-bezier(.4,0,.2,1); /* @kind other */\n  --transition-control:back p;\n  src: url(\"f579e9ce-7537-4524-aa1b-8fe40fbcafb2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Libre Franklin';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"77eba6e7-812c-4534-9b34-4fa283e67c15\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n:root{\n  --font-sans:\"Libre Franklin\",Arial,Helvetica,sans-serif;\n  --font-display:var(--font-sans);\n  /* Retained alias: CUNY specifies no condensed web face. Resolves to the sans. */\n  --font-condensed:var(--font-sans);\n  /* Addition, not CUNY-specified — see readme.md > Intentional additions. */\n  --font-mono:\"IBM Plex Mono\",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n\n/* ============================================================================\n   Colours — sourced verbatim from CUNY Office of Communications & Marketing,\n   University Identity > Colors (cuny.edu). Hex values are the published ones.\n   Do not eyeball or derive brand colours; if a value is not below, it is not\n   a CUNY colour. The supplied OLS logo files were built to an older CUNY Blue\n   (#1D3A83) and are NOT the colour source — see readme.md.\n   ========================================================================= */\n:root{\n  /* ---------- PRIMARY. ~50% of any design. Never omit CUNY Blue. ---------- */\n  --cuny-blue:#0033A1;   /* PMS 286 C   · CMYK 100/75/0/4 · RGB 0/51/161 */\n  --taxi:#FFB71B;        /* PMS 1235 C  · CMYK 0/31/98/0  · RGB 255/183/27 */\n\n  /* ---------- SECONDARY. Support and visual interest, in moderation. ---------- */\n  --indigo:#011D49;      /* PMS 2768 C */\n  --azure:#1F5CFF;       /* PMS 285 C  */\n  --deep-cyan:#00AFEF;   /* PMS 305 C  */\n  --sky:#A3C9FF;         /* PMS 7451 C */\n  --lemonade:#FFEE1D;    /* PMS 803 C  */\n  --cream:#FFFCD5;       /* PMS 9141 C */\n\n  /* ---------- NEUTRAL. Support, in moderation. Warm, not blue-grey. ---------- */\n  --pearl:#F7F4EB;       /* PMS 9060 C */\n  --dove:#D8D7D6;        /* PMS Cool Gray 1 C */\n  --slate:#688197;       /* PMS 2165 C */\n  --charcoal:#383838;    /* PMS Black 7 C */\n  --pewter:#76777A;      /* PMS Cool Gray 9 C */\n  --ochre:#C89210;       /* PMS 1245 C */\n  --umber:#896B25;       /* PMS 1265 C */\n\n  /* ---------- ACCENT. Highlights only. Never a primary colour. ---------- */\n  --strawberry:#EA0045;  /* PMS 192 C  */\n  --hot-pink:#E81F75;    /* PMS 213 C  */\n  --bubble-gum:#FF9CCD;  /* PMS 210 C  */\n  --blush:#FFDCEE;       /* PMS 705 C  */\n  --cranberry:#BF0D3E;   /* PMS 193 C  */\n  --coral:#FF7370;       /* PMS 805 C  */\n  --salmon:#FFCBCA;      /* PMS 7415 C */\n  --grape:#510C76;       /* PMS 2607 C */\n  --lilac:#9A3CB0;       /* PMS 7442 C */\n  --thistle:#DEC2EB;     /* PMS 263 C  */\n  --sea-green:#005C5A;   /* PMS 561 C  */\n  --chartreuse:#C2D500;  /* PMS 382 C  */\n  --liberty:#45C2B1;     /* PMS 3258 C */\n  --mint:#B5EBD8;        /* PMS 331 C  */\n\n  --white:#FFFFFF;\n  --black:#000000;\n\n  /* ============ Working scales ============\n     Steps that are NOT published CUNY colours exist only to make UI states\n     possible (hover, disabled, hairlines). Every published colour is marked. */\n  --blue-950:#01122E;\n  --blue-900:#011D49;   /* = Indigo */\n  --blue-800:#002679;\n  --blue-700:#0033A1;   /* = CUNY Blue */\n  --blue-600:#0F45BE;\n  --blue-500:#1F5CFF;   /* = Azure */\n  --blue-400:#5C87FF;\n  --blue-300:#A3C9FF;   /* = Sky */\n  --blue-200:#C6DBFF;\n  --blue-100:#E4EEFF;\n  --blue-50:#F2F7FF;\n\n  --gray-950:#1A1A1A;\n  --gray-900:#383838;   /* = Charcoal */\n  --gray-800:#4D4D4D;\n  --gray-700:#5F6062;\n  --gray-600:#76777A;   /* = Pewter */\n  --gray-500:#949599;\n  --gray-450:#8A8B8F;   /* not a CUNY colour — lowest step reaching 3:1 on white,\n                           so interactive control boundaries meet WCAG 1.4.11 */\n  --gray-400:#B4B4B3;\n  --gray-300:#D8D7D6;   /* = Dove */\n  --gray-200:#E6E5E2;\n  --gray-150:#EEEDE8;\n  --gray-100:#F2F1EC;\n  --gray-50:#F7F4EB;    /* = Pearl */\n\n  /* Status ramps, built only from published CUNY colours */\n  --green-700:#004745;\n  --green-600:#005C5A;  /* = Sea Green */\n  --green-100:#B5EBD8;  /* = Mint */\n  --amber-700:#896B25;  /* = Umber, for warning TEXT (AA on white) */\n  --amber-600:#C89210;  /* = Ochre, for warning MARKS */\n  --amber-100:#FFFCD5;  /* = Cream */\n  --red-700:#8E0A2E;\n  --red-600:#BF0D3E;    /* = Cranberry */\n  --red-100:#FFCBCA;    /* = Salmon */\n\n  /* ================= Semantic aliases ================= */\n  /* Text */\n  --text-body:var(--charcoal);\n  --text-heading:var(--indigo);\n  /* Pewter (4.48:1) and Slate (4.06:1) are published CUNY colours but fall short\n     of WCAG AA for body-size text, so the muted/subtle TEXT aliases point at\n     darker working steps. Use Pewter and Slate directly for rules, marks, and\n     display-size type only — never for 13–16px copy. */\n  --text-muted:var(--gray-800);    /* #4D4D4D · 8.45:1 on white */\n  --text-subtle:var(--gray-700);   /* #5F6062 · 6.29:1 on white */\n  --text-inverse:var(--white);\n  --text-link:var(--cuny-blue);\n  --text-link-hover:var(--indigo);\n  --text-accent:var(--cuny-blue);\n  --text-danger:var(--cranberry);\n  --text-success:var(--sea-green);\n  --text-warning:var(--umber);\n\n  /* Surfaces */\n  --surface-page:var(--white);\n  --surface-sunken:var(--pearl);\n  --surface-card:var(--white);\n  --surface-raised:var(--white);\n  --surface-brand:var(--cuny-blue);\n  --surface-brand-deep:var(--indigo);\n  --surface-brand-subtle:var(--blue-50);\n  --surface-neutral-subtle:var(--gray-100);\n  --surface-hover:var(--gray-100);\n " sc-camel-on-click=\"{{ startOver }}\" hint-size=\"130px,40px\">Start over<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"background: var(--surface-card); border-width: 1px; border-style: solid; border-color: var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden;\">\n        <h2 style=\"margin: 0; font: inherit;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleAlt }}\" aria-expanded=\"{{ altExpanded }}\" aria-controls=\"alt-panel\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; padding: 12px 20px; background: none; border: 0; cursor: pointer; font: var(--type-label); color: var(--text-heading); text-align: left; transition: background-color var(--duration-instant) var(--ease-standard);\" style-hover=\"background-color: var(--surface-hover);\" style-focus=\"outline: 2px solid transparent; box-shadow: inset 0 0 0 3px var(--border-focus);\">\n            <span>Looking for a different order type?<\u002Fspan>\n            <span style=\"display: flex; color: var(--text-accent);\">\n              <x-import component-from-global-scope=\"CUNYLibraryServicesDesignSystem_bb051c.Icon\" name=\"{{ altIcon }}\" size=\"{{ 16 }}\" hint-size=\"16px,16px\"><\u002Fx-import>\n            <\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fh2>\n        <sc-if value=\"{{ altOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div id=\"alt-panel\" role=\"region\" aria-label=\"Alternative order types\" style=\"padding: 16px 20px 20px; border-top-width: 1px; border-top-style: solid; border-top-color: var(--border-subtle); display: flex; flex-direction: column; gap: 16px;\">\n            <p style=\"margin: 0; font: var(--type-body-sm); color: var(--text-muted); max-width: var(--measure-prose); text-wrap: pretty;\">The order types below may be available in Alma but are not recommended at CUNY. Use the recommended type instead for a more consistent workflow.<\u002Fp>\n            <x-import component-from-global-scope=\"CUNYLibraryServicesDesignSystem_bb051c.DataTable\" columns=\"{{ altColumns }}\" rows=\"{{ altRows }}\" dense=\"{{ true }}\" hint-size=\"100%,640px\"><\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ showChrome }}\" hint-placeholder-val=\"{{ true }}\">\n    <footer style=\"background: var(--surface-card); border-top-width: 1px; border-top-style: solid; border-top-color: var(--border-subtle);\">\n      <div style=\"max-width: var(--container-content); margin: 0 auto; padding: 16px var(--gutter-page); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font: var(--type-body-sm); color: var(--text-muted);\">\n        <img src=\"5719444c-e4c7-40c5-858e-09492fa70383\" alt=\"CUNY Library Services\" height=\"40\" style=\"height: 40px; width: auto; display: block;\">\n        <p style=\"margin: 0;\">Need help? Open a ticket with OLS Systems at <a href=\"mailto:support@cuny-ols.libanswers.com\">support@cuny-ols.libanswers.com<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;embedMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;show&quot;,&quot;auto&quot;,&quot;hide&quot;],&quot;default&quot;:&quot;show&quot;,&quot;tsType&quot;:&quot;'show' | 'auto' | 'hide'&quot;,&quot;label&quot;:&quot;Header and footer&quot;,&quot;description&quot;:&quot;auto hides them when embedded in an iframe (e.g. Alma widget), matching the original site&quot;}}\">\nconst ALT_ROWS = [\n  ['Electronic Book - One Time', ['Electronic Title - One Time']],\n  ['Electronic Book - Standing Order', ['Electronic Title - Standing Order']],\n  ['Electronic Book - Subscription', ['Electronic Title - Subscription']],\n  ['Electronic Journal - One Time', ['Electronic Title - One Time']],\n  ['Electronic Journal - Subscription', ['Electronic Title - Subscription']],\n  ['Print Book - One Time', ['Physical - One Time']],\n  ['Print Book - Standing Order', ['Physical - Standing Order Monograph', 'Physical - Standing Order Non Monograph']],\n  ['Print Journal - One Time', ['Physical - One Time']],\n  ['Print Journal - Subscription', ['Physical - Subscription']],\n  ['Manuscript', ['Physical - One Time']],\n  ['Map', ['Physical - One Time']],\n  ['Microform', ['Physical - One Time']],\n  ['Mixed Material', ['Physical - One Time']],\n  ['Musical Score', ['Physical - One Time']],\n  ['Physical Computer File - One Time', ['Physical - One Time']],\n  ['Physical Computer File - Subscription', ['Physical - Subscription']],\n  ['Remote Computer File - One Time', ['Electronic Title - One Time']],\n  ['Remote Computer File - Subscription', ['Electronic Title - Subscription']],\n  ['Sound Recording', ['Physical - One Time']],\n  ['Visual Material', ['Physical - One Time']],\n  ['Database Service - One Time', ['Electronic Collection - One Time']]\n].map(([from, to], i) => ({ id: i, from, to }));\n\nconst ORDER_TREE = {\n  id: 'root',\n  question: 'What are you ordering?',\n  options: [\n    {\n      label: 'A physical item',\n      desc: 'Book, DVD, score, map, calculator, or other tangible object',\n      next: {\n        id: 'physical',\n        question: 'How will you pay for this?',\n        options: [\n          {\n            label: 'One-time purchase',\n            desc: 'A single purchase with no ongoing commitment',\n            result: {\n              type: 'Physical - One Time',\n              explanation: '<p>Use this for any one-time purchase of a physical item: books, DVDs, maps, scores, microforms, mixed materials, and anything else you can hold in your hand.<\u002Fp><p>Alma will expect you to <strong>receive<\u002Fstrong> the item when it arrives, then process an <strong>invoice<\u002Fstrong>. The order will close after that.<\u002Fp>',\n            }\n          },\n          {\n            label: 'Standing order',\n            desc: 'Vendor ships new volumes in a set or series as they are published',\n            next: {\n              id: 'physical-so',\n              question: 'How are the volumes cataloged?',\n              options: [\n                {\n                  label: 'Each volume has its own catalog record',\n                  desc: 'Example: Ancient Christian Writers series',\n                  result: {\n                    type: 'Physical - Standing Order Monograph',\n                    explanation: '<p>Use this when each volume in a series or set gets its own bibliographic record, holdings record, and item record.<\u002Fp><p>New volumes are received like one-time orders. They will not appear in the Continuous receiving queue.<\u002Fp>',\n                  }\n                },\n                {\n                  label: 'All volumes share one catalog record',\n                  desc: 'Example: Guinness World Records',\n                  result: {\n                    type: 'Physical - Standing Order Non Monograph',\n                    explanation: '<p>Use this when all volumes share one bibliographic record and holdings record, with each volume treated like a journal issue.<\u002Fp><p>New volumes are received like subscriptions. They will appear in the Continuous tab of the receiving queue.<\u002Fp>',\n                  }\n                }\n              ]\n            }\n          },\n          {\n            label: 'Subscription',\n            desc: 'Open-ended or renewable order (e.g., journal, newspaper)',\n            result: {\n              type: 'Physical - Subscription',\n              explanation: '<p>Use this for recurring payments for a single physical title, such as a journal or newspaper subscription.<\u002Fp><p>Alma manages renewal dates and expects ongoing receiving and invoicing. New issues appear in the Continuous tab of the receiving queue.<\u002Fp>',\n            }\n          }\n        ]\n      }\n    },\n    {\n      label: 'A single electronic resource',\n      desc: 'Ebook, e-journal, streaming video, or other individual online resource',\n      next: {\n        id: 'e-single',\n        question: 'How will you pay for this?',\n        options: [\n          {\n            label: 'One-time purchase or license',\n            desc: 'A single purchase with no ongoing commitment',\n            next: {\n              id: 'e-single-ot',\n              question: 'Have you ordered this title before?',\n              tooltip: 'Check whether you\\'ve previously placed an order for this title on the same platform (e.g., Kanopy unlimited users, Swank one-year license, 3 simultaneous users on EBSCOhost).',\n              tooltipId: 'tooltip-reorder',\n              options: [\n                {\n                  label: 'No',\n                  desc: 'This is the first order for this title on this platform',\n                  result: {\n                    type: 'Electronic Title - One Time',\n                    explanation: '<p>Use this for a one-time purchase or license of a single electronic resource: an ebook, an e-journal, a streaming video, or similar.<\u002Fp><p>Alma will expect you to <strong>activate<\u002Fstrong> the resource (not physically receive it), then process an <strong>invoice<\u002Fstrong>. The order will close after that.<\u002Fp>',\n                  }\n                },\n                {\n                  label: 'Yes',\n                  desc: 'There is already an order for this title on the same platform',\n                  result: {\n                    type: 'License Upgrade',\n                    explanation: '<p>Use this when you are re-purchasing or renewing a license for a title that already has an order attached to its electronic portfolio.<\u002Fp><p>License Upgrade only needs to be attached to the bibliographic record, not the portfolio. This avoids creating a duplicate portfolio for the same title.<\u002Fp>',\n                    tip: '<strong>Why not Electronic Title - One Time?<\u002Fstrong> You can only attach one order to one electronic portfolio. If you used Electronic Title - One Time again, you would need to create a second (inactive) portfolio, which clutters your inventory.'\n                  }\n                }\n              ]\n            }\n          },\n          {\n            label: 'Standing order',\n            desc: 'Vendor provides access to new volumes or editions as they are published',\n            result: {\n              type: 'Electronic Title - Standing Order',\n              explanation: '<p>Use this for an ongoing electronic series where the vendor provides new volumes or editions automatically.<\u002Fp><p>The order remains open indefinitely, generating new activation and invoicing events over time.<\u002Fp>',\n            }\n          },\n          {\n            label: 'Subscription',\n            desc: 'Open-ended or renewable access (e.g., e-journal subscription)',\n            result: {\n              type: 'Electronic Title - Subscription',\n              explanation: '<p>Use this for recurring access to a single electronic resource, such as an e-journal subscription or an annually renewed streaming video license.<\u002Fp><p>Alma manages renewal dates and expects periodic invoicing.<\u002Fp>',\n            }\n          }\n        ]\n      }\n    },\n    {\n      label: 'A package or collection of electronic resources',\n      desc: 'Database, ebook package, e-journal bundle, or other collection',\n      next: {\n        id: 'e-collection',\n        question: 'How will you pay for this?',\n        options: [\n          {\n            label: 'One-time purchase or fee',\n            desc: 'A single payment (e.g., JSTOR Archive Capital Fee)',\n            result: {\n              type: 'Electronic Collection - One Time',\n              explanation: '<p>Use this for a one-time purchase of or fee for a package of electronic resources, such as a database archive fee or a perpetual ebook collection.<\u002Fp><p>Alma will expect you to <strong>activate<\u002Fstrong> the collection, then process an <strong>invoice<\u002Fstrong>. The order will close after that.<\u002Fp>',\n            }\n          },\n          {\n            label: 'Subscription',\n            desc: 'Open-ended or renewable access (e.g., annual database subscription)',\n            result: {\n              type: 'Electronic Collection - Subscription',\n              explanation: '<p>Use this for ongoing access to a package of electronic resources, such as a database subscription or an annually renewed ebook collection.<\u002Fp><p>Alma manages renewal dates and expects periodic invoicing.<\u002Fp><p>If this is the \"read\" part of a transformative agreement, see <a href=\"https://knowledge.exlibrisgroup.com/Alma/Product_Documentation/010Alma_Online_Help_(English)/020Acquisitions/050Purchasing/Working_with_Open_Access_Agreements?mt-draft=true\">Working with Open Access Agreements<\u002Fa> for setup guidance.<\u002Fp>',\n            }\n          }\n        ]\n      }\n    },\n    {\n      label: 'An access or hosting fee',\n      desc: 'Platform fee, hosting charge, or access fee for an electronic resource',\n      next: {\n        id: 'access-fee',\n        question: 'Is this a one-time fee or recurring?',\n        options: [\n          {\n            label: 'One-time',\n            desc: 'A single fee with no ongoing commitment',\n            next: {\n              id: 'access-fee-ot',\n              question: 'Is this fee for a single title or a collection/package?',\n              options: [\n                {\n                  label: 'A single title',\n                  desc: 'One ebook, e-journal, streaming video, etc.',\n                  result: {\n                    type: 'Electronic Title - One Time',\n                    explanation: '<p>Use this for a one-time fee for a single electronic resource.<\u002Fp><p>Alma will expect you to <strong>activate<\u002Fstrong> the resource, then process an <strong>invoice<\u002Fstrong>. The order will close after that.<\u002Fp>',\n                  }\n                },\n                {\n                  label: 'A collection or package',\n                  desc: 'Database, ebook package, e-journal bundle, etc.',\n                  result: {\n                    type: 'Electronic Collection - One Time',\n                    explanation: '<p>Use this for a one-time fee for a package of electronic resources, such as a database archive fee.<\u002Fp><p>Alma will expect you to <strong>activate<\u002Fstrong> the collection, then process an <strong>invoice<\u002Fstrong>. The order will close after that.<\u002Fp>',\n                  }\n                }\n              ]\n            }\n          },\n          {\n            label: 'Recurring',\n            desc: 'An ongoing fee (e.g., annual hosting charge)',\n            result: {\n              type: 'Access Service - Subscription',\n              explanation: '<p>Use this for recurring access or hosting fees tied to an electronic resource, such as platform hosting charges (e.g., SAGE or CQ Press hosting fees).<\u002Fp><p>This order type creates inventory, so the cost will be connected to the resource in Alma for searching and reporting.<\u002Fp>',\n              tip: '<strong>Make sure there\\'s an electronic resource to attach this to.<\u002Fstrong> If the fee is not associated with an electronic collection or portfolio in Alma, use Other Service - Subscription instead.'\n            }\n          }\n        ]\n      }\n    },\n    {\n      label: 'Article processing charges (APC)',\n      desc: 'Fee to publish an article in an open-access journal',\n      next: {\n        id: 'apc',\n        question: 'Is this a one-time charge or recurring?',\n        options: [\n          {\n            label: 'One-time',\n            desc: 'A single APC for one article',\n            result: {\n              type: 'Article Processing Charges (APC) - One Time',\n              explanation: '<p>Use this for a one-time article processing charge, such as paying to publish a single article in an open-access journal.<\u002Fp><p>If this is part of a transformative agreement, see <a href=\"https://knowledge.exlibrisgroup.com/Alma/Product_Documentation/010Alma_Online_Help_(English)/020Acquisitions/050Purchasing/Working_with_Open_Access_Agreements?mt-draft=true\">Working with Open Access Agreements<\u002Fa> for setup guidance.<\u002Fp>',\n            }\n          },\n          {\n            label: 'Recurring',\n            desc: 'Ongoing APC agreement or membership',\n            result: {\n              type: 'Article Processing Charges (APC) - Subscription',\n              explanation: '<p>Use this for a recurring article processing charge arrangement, such as an ongoing APC agreement with a publisher.<\u002Fp><p>If this is part of a transformative agreement, see <a href=\"https://knowledge.exlibrisgroup.com/Alma/Product_Documentation/010Alma_Online_Help_(English)/020Acquisitions/050Purchasing/Working_with_Open_Access_Agreements?mt-draft=true\">Working with Open Access Agreements<\u002Fa> for setup guidance.<\u002Fp>',\n            }\n          }\n        ]\n      }\n    },\n    {\n      label: 'Something that is not a library resource',\n      desc: 'Supplies, memberships, equipment, document delivery',\n      next: {\n        id: 'other',\n        question: 'Is this a one-time expense or recurring?',\n        options: [\n          {\n            label: 'One-time',\n            desc: 'A single expense (e.g., one-time membership, equipment purchase)',\n            result: {\n              type: 'Other Service - One Time',\n              explanation: '<p>Use this for a non-recurring expense that is not a physical or electronic library resource: supplies, one-time memberships, equipment purchases, and similar purchases.<\u002Fp><p>This order type does <strong>not<\u002Fstrong> create inventory. The order will only be findable through the order lines search in Alma, not through title or inventory searches.<\u002Fp>',\n              tip: '<strong>No inventory means limited visibility.<\u002Fstrong> Use Other Service only when the purchase genuinely has nothing to do with a library resource. If the expense is related to an electronic resource, consider using an order type attached to the resource instead so the cost is connected to the resource for optimal searching and reporting.'\n            }\n          },\n          {\n            label: 'Recurring',\n            desc: 'An ongoing expense (e.g., annual membership, document delivery service)',\n            result: {\n              type: 'Other Service - Subscription',\n              explanation: '<p>Use this for a recurring expense that is not a physical or electronic library resource: annual memberships, document delivery services, ongoing service contracts, and similar commitments.<\u002Fp><p>This order type does <strong>not<\u002Fstrong> create inventory. The order will only be findable through the order lines search in Alma, not through title or inventory searches.<\u002Fp>',\n              tip: '<strong>No inventory means limited visibility.<\u002Fstrong> Use Other Service only when the purchase genuinely has nothing to do with a library resource. If the expense is related to an electronic resource, consider using an order type attached to the resource instead so the cost is connected to the resource for optimal searching and reporting.'\n            }\n          }\n        ]\n      }\n    }\n  ]\n};\n\nconst START_ICONS = ['book', 'tablet', 'newspaper', 'receipt', 'file-text', 'settings'];\n\nclass Component extends DCLogic {\n  state = { tree: null, history: [], altOpen: false };\n  headingRef = React.createRef();\n  h = React.createElement;\n\n  componentDidMount() {\n    this.setState({ tree: ORDER_TREE });\n  }\n  componentDidUpdate(_, prev) {\n    if (prev.history !== this.state.history) {\n      requestAnimationFrame(() => {\n        const el = this.headingRef.current;\n        if (!el) return;\n        el.focus({ preventScroll: true });\n        const top = el.closest('main').getBoundingClientRect().top;\n        if (top < 0) window.scrollTo({ top: window.scrollY + top, behavior: 'smooth' });\n      });\n    }\n  }\n\n  nodeAt(depth) {\n    const { tree, history } = this.state;\n    if (!tree) return null;\n    return depth === 0 ? tree : (history[depth - 1].option.next || null);\n  }\n  choose(i) {\n    const node = this.nodeAt(this.state.history.length);\n    if (!node) return;\n    const option = node.options[i];\n    this.setState(s => ({ history: [...s.history, { choiceLabel: option.label, question: node.question, option }], altOpen: false }));\n  }\n  goTo = n => this.setState(s => ({ history: s.history.slice(0, n), altOpen: false }));\n  goBackOne = () => this.goTo(this.state.history.length - 1);\n  startOver = () => this.goTo(0);\n\n  renderVals() {\n    const h = this.h;\n    const { history, altOpen } = this.state;\n    const last = history[history.length - 1];\n    const result = last && last.option.result;\n    const node = result ? null : this.nodeAt(history.length);\n    const isStart = history.length === 0;\n    const mode = this.props.embedMode ?? 'auto';\n    const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();\n\n    let tipTitle = '', tipBody = null;\n    if (result && result.tip) {\n      const m = result.tip.match(/^<strong>([\\s\\S]*?)<\\/strong>\\s*([\\s\\S]*)$/);\n      tipTitle = m ? m[1] : '';\n      tipBody = h('span', { dangerouslySetInnerHTML: { __html: m ? m[2] : result.tip } });\n    }\n\n    return {\n      showChrome: mode === 'show' || (mode === 'auto' && !inFrame),\n      headingRef: this.headingRef,\n      hasTrail: history.length > 0,\n      pastCrumbs: history.slice(0, -1).map((e, i) => ({ label: e.choiceLabel, title: history[i + 1].question, go: () => this.goTo(i + 1) })),\n      currentCrumb: last ? last.choiceLabel : '',\n      hasHistory: history.length > 0,\n\n      isStart,\n      isQuestion: !isStart && !result,\n      stepLabel: 'Step ' + (history.length + 1),\n      question: node ? node.question : (isStart ? 'What are you ordering?' : ''),\n      hasHint: !!(node && node.tooltip),\n      hint: node ? node.tooltip : '',\n      options: (node ? node.options : []).map((o, i) => ({\n        num: String(i + 1), icon: START_ICONS[i] || 'chevron-right',\n        label: o.label, desc: o.desc, hasDesc: !!o.desc, pick: () => this.choose(i)\n      })),\n\n      isResult: !!result,\n      resultType: result ? result.type : '',\n      explanation: result ? h('div', { style: { display: 'contents' }, dangerouslySetInnerHTML: { __html: result.explanation } }) : null,\n      hasTip: !!(result && result.tip),\n      tipTitle, tipBody,\n\n      goBackOne: this.goBackOne,\n      startOver: this.startOver,\n\n      altOpen,\n      altExpanded: altOpen ? 'true' : 'false',\n      altIcon: altOpen ? 'chevron-up' : 'chevron-down',\n      toggleAlt: () => this.setState(s => ({ altOpen: !s.altOpen })),\n      altColumns: [\n        { key: 'from', label: 'Instead of…', render: r => h('span', { style: { color: 'var(--text-muted)', textDecorationLine: 'line-through', textDecorationColor: 'var(--gray-400)' } }, r.from) },\n        { key: 'to', label: 'Use', render: r => h('span', { style: { fontWeight: 600, color: 'var(--text-body)' } },\n            r.to.length > 1 ? [r.to[0], h('em', { key: 'or', style: { fontWeight: 400, color: 'var(--text-body)' } }, ' or '), r.to[1]] : r.to[0]) }\n      ],\n      altRows: ALT_ROWS\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
